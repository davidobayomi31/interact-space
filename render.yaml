# ── Render deployment ────────────────────────────────────────────────
# One free web service: Vite builds the frontend into dist/, and the
# Express server in server/ serves both that build and /api on one port
# (see the static-file block at the bottom of server/index.js).
services:
  - type: web
    name: interact-space
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Pin the Node version to the one this was built and tested on.
      - key: NODE_VERSION
        value: 22.18.0
      # Signs login sessions. Render generates a strong value once and
      # keeps it — leaving this unset would fall back to the dev secret.
      - key: JWT_SECRET
        generateValue: true
      # Optional: paste an Anthropic key in the Render dashboard to turn on
      # the real LLM companion. Unset → the rule-based fallback, which works.
      - key: ANTHROPIC_API_KEY
        sync: false
