<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/voidaj-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Montserrat:wght@600;700&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before the first paint, so dark mode never flashes white.
      // Dark unless the visitor picked otherwise (the look of Nuel's mockups).
      var t = 'dark'
      try { var saved = localStorage.getItem('voidaj-theme'); if (saved === 'light' || saved === 'dark' || saved === 'system') t = saved } catch (e) {}
      if (t !== 'system') document.documentElement.dataset.theme = t
      document.documentElement.dataset.mode = t === 'light' || t === 'dark' ? t : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    </script>
    <title>VOIDAJ — People, Communities &amp; Opportunities</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
